services:
  - type: web
    name: catalogo-productos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_EMAIL
        value: admin@tienda.com
      - key: ADMIN_PASSWORD
        sync: false
